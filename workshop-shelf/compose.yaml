services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    environment:
      POSTGRES_DB: shelf
      POSTGRES_USER: shelf
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes:
      - db_data:/var/lib/postgresql/data
    networks: [back]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U shelf -d shelf']
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 5s
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: '3'}
  app:
    image: workshop-shelf:${APP_VERSION:-1}
    build:
      context: ./app
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.13-slim-bookworm}
        APP_VERSION: ${APP_VERSION:-1}
    environment:
      DB_HOST: db
      DB_PASSWORD_FILE: /run/secrets/db_password
      APP_VERSION: ${APP_VERSION:-1}
    secrets: [db_password]
    depends_on:
      db: {condition: service_healthy}
    networks: [front, back]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=4)"
      interval: 3s
      timeout: 20s
      retries: 3
      start_period: 20s
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 0.5
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: '3'}
  proxy:
    image: ${CADDY_IMAGE:-caddy:2-alpine}
    ports:
      - '127.0.0.1:${SHELF_PORT:-8088}:80'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    networks: [front]
    depends_on:
      app: {condition: service_healthy}
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: '3'}
volumes:
  db_data:
networks:
  front:
  back:
    internal: true
secrets:
  db_password:
    file: ./secrets/db_password.txt
